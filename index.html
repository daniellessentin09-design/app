<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kassensystem mit automatischem Kassenzettel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #ffffff;
            --accent: #0069d9;
            --accent-dark: #0053ad;
            --danger: #dc3545;
            --text: #212529;
            --muted: #6c757d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
        }

        .layout {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 1.45rem;
        }

        h2 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        .items {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
        }

        .item-btn {
            border: 1px solid #d6dce2;
            border-radius: 8px;
            background: #f8fafc;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .item-btn:hover {
            border-color: var(--accent);
            background: #eef5ff;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .receipt {
            background: #f8f9fa;
            border: 1px dashed #ced4da;
            border-radius: 10px;
            padding: 14px;
            font-family: "Courier New", monospace;
            white-space: pre-wrap;
            min-height: 260px;
            margin-bottom: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .muted {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="layout">
    <section class="card">
        <h1>Kassensystem</h1>
        <p>Artikel antippen, um sie zum Warenkorb hinzuzufügen.</p>

        <div class="items" id="productList"></div>

        <div class="controls">
            <button class="btn-danger" onclick="clearCart()">Warenkorb leeren</button>
        </div>
        <p class="muted">Der Kassenzettel wird automatisch bei jeder Änderung aktualisiert.</p>
    </section>

    <section class="card">
        <h2>Automatischer Kassenzettel</h2>
        <div class="receipt" id="receipt"></div>
        <div class="controls">
            <button class="btn-primary" onclick="window.print()">Kassenzettel drucken</button>
        </div>
    </section>
</div>

<script>
    const products = [
        { name: "Brötchen", price: 0.65 },
        { name: "Kaffee", price: 2.4 },
        { name: "Milch", price: 1.35 },
        { name: "Schokolade", price: 1.95 },
        { name: "Apfelsaft", price: 2.15 }
    ];

    const cart = [];

    function formatEuro(value) {
        return value.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
    }

    function addToCart(product) {
        cart.push(product);
        updateReceipt();
    }

    function clearCart() {
        cart.length = 0;
        updateReceipt();
    }

    function renderProducts() {
        const list = document.getElementById("productList");
        products.forEach((product) => {
            const button = document.createElement("button");
            button.className = "item-btn";
            button.innerText = `${product.name} — ${formatEuro(product.price)}`;
            button.onclick = () => addToCart(product);
            list.appendChild(button);
        });
    }

    function updateReceipt() {
        const receipt = document.getElementById("receipt");
        const now = new Date();
        const header = [
            "BELEG",
            "--------------------------------",
            `Datum: ${now.toLocaleDateString("de-DE")}`,
            `Zeit:  ${now.toLocaleTimeString("de-DE")}`,
            ""
        ];

        if (cart.length === 0) {
            receipt.innerText = `${header.join("\n")}Keine Artikel im Warenkorb.`;
            return;
        }

        const itemLines = cart.map((item, index) =>
            `${String(index + 1).padStart(2, "0")}. ${item.name.padEnd(14, " ")} ${formatEuro(item.price)}`
        );

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const footer = [
            "",
            "--------------------------------",
            `ANZAHL ARTIKEL: ${cart.length}`,
            `GESAMT:        ${formatEuro(total)}`,
            "--------------------------------",
            "Danke für Ihren Einkauf!"
        ];

        receipt.innerText = [...header, ...itemLines, ...footer].join("\n");
    }

    renderProducts();
    updateReceipt();
</script>
</body>
</html>
